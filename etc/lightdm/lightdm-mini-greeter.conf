[greeter]
user = martin
show-password-label = false
invalid-password-text = Invalid Password
show-input-cursor = true
password-alignment = center
password-input-width = 20
show-image-on-all-monitors = false
show-sys-info = true

[greeter-hotkeys]
mod-key = meta
shutdown-key = s
restart-key = r
hibernate-key = h
suspend-key = u
session-key = e

[greeter-theme]
font = "Iosevka"
font-size = 1.1em
font-weight = bold
font-style = normal
text-color = "#cdd6f4"
error-color = "#A54242"
background-image = ""
background-color = "#1a182b"
window-color = "#11101e"
border-color = "#38d8a3"
border-width = 2px
layout-space = 30
password-character = -1
password-color = "#cdd6f4"
password-background-color = "#2b2940"
password-border-color = "#38d8a3"
password-border-width = 1px
password-border-radius = 6px
sys-info-font = "Iosevka"
sys-info-font-size = 0.8em
sys-info-color = "#6272a4"
sys-info-margin = 0px 0px 20px 0px
