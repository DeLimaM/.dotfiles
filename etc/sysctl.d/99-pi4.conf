# ============================================================================
# Raspberry Pi 4 — sysctl tuning (headless server, Argon M2 NVMe SSD)
# ============================================================================

# -- Memory --
# Lower swappiness: prefer RAM over swap (Pi has 8GB)
vm.swappiness = 10

# -- Network --
# Enable TCP BBR congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Increase connection tracking for server use
net.core.somaxconn = 1024
